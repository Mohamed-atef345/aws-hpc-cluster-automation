[defaults]
inventory = inventory/cluster.aws_ec2.yml
roles_path = roles
interpreter_python = auto_silent
inject_facts_as_vars = false
retry_files_enabled = false
# /home is mounted from EFS during configuration, so connection temporary
# files must remain on the instance root filesystem.
remote_tmp = /tmp/.ansible/tmp

[inventory]
enable_plugins = amazon.aws.aws_ec2, auto, yaml, ini
