---

- name: Read sanitized FreeIPA installation errors
  ansible.builtin.shell: |
    set -o pipefail
    grep -Ei \
      'error|critical|exception|failed|requires|currently in use|unable|invalid' \
      /var/log/ipaserver-install.log 2>/dev/null |
      tail -n 120
  args:
    executable: /bin/bash
  register: freeipa_install_diagnostics
  changed_when: false
  failed_when: false

- name: Display sanitized FreeIPA installation errors
  ansible.builtin.debug:
    var: freeipa_install_diagnostics.stdout_lines
