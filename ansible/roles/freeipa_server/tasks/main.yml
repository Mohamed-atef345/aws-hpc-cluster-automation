---

- name: Verify common role completed
  ansible.builtin.assert:
    that:
      - common_role_completed is defined
      - common_role_completed | bool
    fail_msg: "The common role has not completed successfully on this host."

- name: Confirm that the instance role is FreeIPA
  ansible.builtin.assert:
    that:
      - aws_ec2_tags is defined
      - aws_ec2_tags['Role'] is defined
      - aws_ec2_tags['Role'] == 'freeipa'
    fail_msg: "The EC2 instance is not tagged with Role=freeipa."

- name: Confirm FreeIPA FQDN temporarily resolves to its private IP
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ freeipa_server_fqdn }}"
  register: freeipa_fqdn_lookup
  changed_when: false
  failed_when: >-
    freeipa_fqdn_lookup.rc != 0 or
    (freeipa_fqdn_lookup.stdout.split() | first | default('')) != freeipa_server_ip

- name: Confirm the FreeIPA credentials secret has both required values
  ansible.builtin.shell: |
    set -euo pipefail

    {{ aws_cli_executable | quote }} secretsmanager get-secret-value \
      --secret-id {{ freeipa_credentials_secret_name | quote }} \
      --region {{ aws_region | quote }} \
      --query SecretString \
      --output text \
      --no-cli-pager \
    | jq -e '
        (.admin_password | type == "string" and length > 0) and
        (.directory_manager_password | type == "string" and length > 0)
      ' >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Install the FreeIPA server and integrated DNS packages
  block:
    - name: Install FreeIPA packages
      ansible.builtin.dnf:
        name: "{{ freeipa_server_packages }}"
        state: present
        update_cache: true
  rescue:
    - name: Clear stale DNF cache after a package transaction failure
      ansible.builtin.command:
        argv:
          - dnf
          - clean
          - all
      changed_when: true

    - name: Rebuild DNF metadata cache
      ansible.builtin.command:
        argv:
          - dnf
          - makecache
          - --refresh
      changed_when: true

    - name: Retry FreeIPA package installation with a fresh cache
      ansible.builtin.dnf:
        name: "{{ freeipa_server_packages }}"
        state: present
        update_cache: true

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Open the FreeIPA and DNS firewalld services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ freeipa_firewalld_services }}"

- name: Ensure rngd is enabled and running for sufficient entropy
  ansible.builtin.systemd_service:
    name: rngd
    enabled: true
    state: started

- name: Check whether the FreeIPA server installation is complete
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        from ipalib.facts import is_ipa_configured;
        raise SystemExit(0 if is_ipa_configured() else 1)
  register: freeipa_server_configured
  changed_when: false
  failed_when: false

- name: Check for state left by an incomplete FreeIPA installation
  ansible.builtin.stat:
    path: "{{ freeipa_server_state_file }}"
  register: freeipa_server_state
  when: freeipa_server_configured.rc != 0

- name: Stop IPA-related services before cleanup
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ipa
    - krb5kdc
    - kadmin
    - named-pkcs11
    - named
    - "pki-tomcatd@{{ freeipa_pki_server_instance }}.service"
    - "dirsrv@{{ freeipa_directory_server_instance }}.service"
  failed_when: false
  when: freeipa_server_configured.rc != 0

- name: Clean up an incomplete FreeIPA installation
  ansible.builtin.command:
    argv:
      - ipa-server-install
      - --uninstall
      - --unattended
  changed_when: true
  failed_when: false
  when: freeipa_server_configured.rc != 0

- name: Check for a residual PKI server instance
  ansible.builtin.stat:
    path: "{{ freeipa_pki_server_path }}"
  register: freeipa_residual_pki_server
  when: freeipa_server_configured.rc != 0

- name: Remove the residual PKI server instance
  ansible.builtin.command:
    argv:
      - pki-server
      - remove
      - --force
      - --remove-conf
      - "{{ freeipa_pki_server_instance }}"
  changed_when: true
  failed_when: false
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_residual_pki_server.stat.exists | default(false)

- name: Remove all residual Directory Server instances and stop LDAP processes
  ansible.builtin.shell: |
    set -euo pipefail
    for inst in $(dsctl -l 2>/dev/null || true); do
      dsctl "$inst" stop 2>/dev/null || true
      dsctl "$inst" remove --do-it 2>/dev/null || true
    done
    systemctl stop dirsrv.target 2>/dev/null || true
    systemctl stop 'dirsrv@*' 2>/dev/null || true
    systemctl disable dirsrv.target 2>/dev/null || true
    pkill -9 -f ns-slapd 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false
  when: freeipa_server_configured.rc != 0


- name: Remove stale FreeIPA certificate bootstrap artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ freeipa_partial_install_artifacts }}"
  when: freeipa_server_configured.rc != 0

- name: Reload systemd daemon after removing residual unit files
  ansible.builtin.systemd:
    daemon_reload: true
  when: freeipa_server_configured.rc != 0

- name: Remove residual IPA state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/ipa
    - /var/lib/sss/db
    - /var/lib/sss/mc
    - /var/log/ipa
    - /etc/ipa/default.conf
    - /root/ipa.csr
    - /var/log/pki
    - /var/lib/pki
  when: freeipa_server_configured.rc != 0

- name: Wait for LDAP ports to be released after cleanup
  ansible.builtin.wait_for:
    host: "{{ item.host }}"
    port: "{{ item.port }}"
    state: stopped
    delay: 2
    timeout: 30
  loop:
    - { host: "127.0.0.1", port: 389 }
    - { host: "127.0.0.1", port: 636 }
    - { host: "{{ freeipa_server_ip }}", port: 389 }
    - { host: "{{ freeipa_server_ip }}", port: 636 }
  when: freeipa_server_configured.rc != 0

- name: Ensure directories required by ipa-server-install exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/ipa
    - /etc/ipa/custodia
    - /etc/ipa/dnssec
    - /var/lib/ipa
    - /var/lib/ipa/sysrestore
    - /var/lib/ipa/sysupgrade
    - /var/lib/ipa/pki-ca
    - /var/lib/ipa/certs
    - /var/lib/ipa/backup
    - /var/lib/ipa/dna
    - /var/lib/ipa/dnssec
    - /var/lib/ipa/gssproxy
    - /var/lib/ipa/custodia
    - /var/lib/ipa-client
    - /var/lib/ipa-client/sysrestore
    - /var/log/ipa
    - /etc/systemd/system/pki-tomcatd.target.wants
  when: freeipa_server_configured.rc != 0

- name: Ensure PKI directories exist with proper pkiuser ownership
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pkiuser
    group: pkiuser
    mode: "0775"
  loop:
    - /var/log/pki
    - /var/lib/pki
  when: freeipa_server_configured.rc != 0

- name: Ensure FreeIPA state files exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  loop:
    - /var/lib/ipa/sysrestore/sysrestore.state
    - /var/lib/ipa/sysupgrade/sysupgrade.state
  when: freeipa_server_configured.rc != 0

- name: Retrieve FreeIPA credentials from Secrets Manager
  ansible.builtin.shell: |
    set -euo pipefail
    {{ aws_cli_executable | quote }} secretsmanager get-secret-value \
      --secret-id {{ freeipa_credentials_secret_name | quote }} \
      --region {{ aws_region | quote }} \
      --query SecretString \
      --output text \
      --no-cli-pager
  args:
    executable: /bin/bash
  register: freeipa_secret_json
  changed_when: false
  no_log: true
- name: Ensure LDAP ports 389 and 636 are not held by any process
  ansible.builtin.shell: |
    set -euo pipefail
    pkill -9 -f ns-slapd 2>/dev/null || true
    pkill -9 -f slapd 2>/dev/null || true
    sleep 1
  args:
    executable: /bin/bash
  changed_when: false
  when: freeipa_server_configured.rc != 0

- name: Install the FreeIPA server non-interactively
  ansible.builtin.command:
    argv:
      - ipa-server-install
      - --unattended
      - --hostname
      - "{{ freeipa_server_fqdn }}"
      - --ip-address
      - "{{ freeipa_server_ip }}"
      - --domain
      - "{{ freeipa_domain }}"
      - --realm
      - "{{ freeipa_realm }}"
      - --setup-dns
      - --forwarder
      - "{{ freeipa_dns_forwarder }}"
      - --reverse-zone
      - "{{ freeipa_reverse_zone }}"
      - --allow-zone-overlap
      - --no-host-dns
      - --admin-password
      - "{{ (freeipa_secret_json.stdout | from_json).admin_password }}"
      - --ds-password
      - "{{ (freeipa_secret_json.stdout | from_json).directory_manager_password }}"
  no_log: true
  register: freeipa_install_result
  failed_when: false
  when: freeipa_server_configured.rc != 0
  changed_when: freeipa_install_result.rc | default(1) == 0

- name: Show FreeIPA install log on failure
  ansible.builtin.command: tail -n 100 /var/log/ipaserver-install.log
  register: freeipa_install_log
  changed_when: false
  failed_when: false
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_install_result.rc | default(0) != 0

- name: Display FreeIPA install failure log
  ansible.builtin.debug:
    var: freeipa_install_log.stdout_lines
  when:
    - freeipa_install_log is not skipped
    - freeipa_install_log.stdout_lines is defined

- name: Find PKI logs on failure
  ansible.builtin.find:
    paths: /var/log/pki
    file_type: file
    recurse: true
  register: freeipa_pki_log_files
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_install_result.rc | default(0) != 0

- name: Read PKI logs on failure
  ansible.builtin.command: "tail -n 80 {{ item.path }}"
  loop: "{{ freeipa_pki_log_files.files | default([]) }}"
  register: freeipa_pki_logs_content
  changed_when: false
  failed_when: false
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_install_result.rc | default(0) != 0

- name: Display PKI failure logs
  ansible.builtin.debug:
    msg:
      logfile: "{{ item.item.path }}"
      content: "{{ item.stdout_lines }}"
  loop: "{{ freeipa_pki_logs_content.results | default([]) }}"
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_install_result.rc | default(0) != 0
    - item.stdout_lines is defined
    - item.stdout_lines | length > 0

- name: Fail if FreeIPA installation failed
  ansible.builtin.fail:
    msg: "FreeIPA server installation failed. See the log output above for details."
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_install_result.rc | default(0) != 0

- name: Enable and start the FreeIPA service
  ansible.builtin.systemd_service:
    name: ipa
    enabled: true
    state: started

- name: Confirm all FreeIPA services are running
  ansible.builtin.command:
    argv:
      - ipactl
      - status
  changed_when: false

- name: Query the FreeIPA server A record from integrated DNS
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "{{ freeipa_server_fqdn }}"
      - A
  register: freeipa_a_record
  changed_when: false
  failed_when: >-
    freeipa_a_record.rc != 0 or
    freeipa_server_ip not in freeipa_a_record.stdout_lines

- name: Query the LDAP service record from integrated DNS
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "_ldap._tcp.{{ freeipa_domain }}"
      - SRV
  register: freeipa_ldap_srv_record
  changed_when: false
  failed_when: >-
    freeipa_ldap_srv_record.rc != 0 or
    freeipa_ldap_srv_record.stdout | trim | length == 0

- name: Query the Kerberos service record from integrated DNS
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "_kerberos._udp.{{ freeipa_domain }}"
      - SRV
  register: freeipa_kerberos_srv_record
  changed_when: false
  failed_when: >-
    freeipa_kerberos_srv_record.rc != 0 or
    freeipa_kerberos_srv_record.stdout | trim | length == 0

- name: Verify that integrated DNS forwarding works
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "{{ freeipa_dns_forward_test_name }}"
      - A
  register: freeipa_forwarded_dns_record
  changed_when: false
  failed_when: >-
    freeipa_forwarded_dns_record.rc != 0 or
    freeipa_forwarded_dns_record.stdout | trim | length == 0

- name: Record successful completion of the FreeIPA server role
  ansible.builtin.set_fact:
    freeipa_server_role_completed: true
