---

- name: Verify common role completed
  ansible.builtin.assert:
    that:
      - common_role_completed is defined
      - common_role_completed | bool
    fail_msg: "The common role has not completed successfully on this host."

- name: Confirm that the instance role is FreeIPA
  ansible.builtin.assert:
    that:
      - aws_ec2_tags is defined
      - aws_ec2_tags['Role'] is defined
      - aws_ec2_tags['Role'] == 'freeipa'
    fail_msg: "The EC2 instance is not tagged with Role=freeipa."

- name: Confirm FreeIPA FQDN temporarily resolves to its private IP
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ freeipa_server_fqdn }}"
  register: freeipa_fqdn_lookup
  changed_when: false
  failed_when: >-
    freeipa_fqdn_lookup.rc != 0 or
    (freeipa_fqdn_lookup.stdout.split() | first | default('')) != freeipa_server_ip

- name: Confirm the FreeIPA credentials secret has both required values
  ansible.builtin.shell: |
    set -euo pipefail

    {{ aws_cli_executable | quote }} secretsmanager get-secret-value \
      --secret-id {{ freeipa_credentials_secret_name | quote }} \
      --region {{ aws_region | quote }} \
      --query SecretString \
      --output text \
      --no-cli-pager \
    | jq -e '
        (.admin_password | type == "string" and length > 0) and
        (.directory_manager_password | type == "string" and length > 0)
      ' >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Install the FreeIPA server and integrated DNS packages
  block:
    - name: Install FreeIPA packages
      ansible.builtin.dnf:
        name: "{{ freeipa_server_packages }}"
        state: present
        update_cache: true
  rescue:
    - name: Clear stale DNF cache after a package transaction failure
      ansible.builtin.command:
        argv:
          - dnf
          - clean
          - all
      changed_when: true

    - name: Rebuild DNF metadata cache
      ansible.builtin.command:
        argv:
          - dnf
          - makecache
          - --refresh
      changed_when: true

    - name: Retry FreeIPA package installation with a fresh cache
      ansible.builtin.dnf:
        name: "{{ freeipa_server_packages }}"
        state: present
        update_cache: true

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Open the FreeIPA and DNS firewalld services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ freeipa_firewalld_services }}"

- name: Check whether the FreeIPA server installation is complete
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        from ipalib.facts import is_ipa_configured;
        raise SystemExit(0 if is_ipa_configured() else 1)
  register: freeipa_server_configured
  changed_when: false
  failed_when: false

- name: Check for state left by an incomplete FreeIPA installation
  ansible.builtin.stat:
    path: "{{ freeipa_server_state_file }}"
  register: freeipa_server_state
  when: freeipa_server_configured.rc != 0

- name: Clean up an incomplete FreeIPA installation
  ansible.builtin.command:
    argv:
      - ipa-server-install
      - --uninstall
      - --unattended
  changed_when: true
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_server_state.stat.exists | default(false)

- name: Stop services left running by an incomplete FreeIPA installation
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ freeipa_partial_install_services }}"
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_server_state.stat.exists | default(false)

- name: Wait for LDAP ports to be released after cleanup
  ansible.builtin.wait_for:
    port: "{{ item }}"
    state: stopped
    timeout: 60
  loop:
    - 389
    - 636
  when:
    - freeipa_server_configured.rc != 0
    - freeipa_server_state.stat.exists | default(false)

- name: Install the FreeIPA server non-interactively
  ansible.builtin.shell: |
    set -euo pipefail

    secret_json="$(
      {{ aws_cli_executable | quote }} secretsmanager get-secret-value \
        --secret-id {{ freeipa_credentials_secret_name | quote }} \
        --region {{ aws_region | quote }} \
        --query SecretString \
        --output text \
        --no-cli-pager
    )"

    admin_password="$(jq -er '.admin_password' <<< "$secret_json")"
    directory_manager_password="$(
      jq -er '.directory_manager_password' <<< "$secret_json"
    )"

    ipa-server-install \
      --unattended \
      --hostname {{ freeipa_server_fqdn | quote }} \
      --ip-address {{ freeipa_server_ip | quote }} \
      --domain {{ freeipa_domain | quote }} \
      --realm {{ freeipa_realm | quote }} \
      --setup-dns \
      --forwarder {{ freeipa_dns_forwarder | quote }} \
      --reverse-zone {{ freeipa_reverse_zone | quote }} \
      --admin-password "$admin_password" \
      --ds-password "$directory_manager_password"

    unset secret_json admin_password directory_manager_password
  args:
    executable: /bin/bash
  when: freeipa_server_configured.rc != 0
  changed_when: true

- name: Enable and start the FreeIPA service
  ansible.builtin.systemd_service:
    name: ipa
    enabled: true
    state: started

- name: Confirm all FreeIPA services are running
  ansible.builtin.command:
    argv:
      - ipactl
      - status
  changed_when: false

- name: Query the FreeIPA server A record from integrated DNS
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "{{ freeipa_server_fqdn }}"
      - A
  register: freeipa_a_record
  changed_when: false
  failed_when: >-
    freeipa_a_record.rc != 0 or
    freeipa_server_ip not in freeipa_a_record.stdout_lines

- name: Query the LDAP service record from integrated DNS
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "_ldap._tcp.{{ freeipa_domain }}"
      - SRV
  register: freeipa_ldap_srv_record
  changed_when: false
  failed_when: >-
    freeipa_ldap_srv_record.rc != 0 or
    freeipa_ldap_srv_record.stdout | trim | length == 0

- name: Query the Kerberos service record from integrated DNS
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "_kerberos._udp.{{ freeipa_domain }}"
      - SRV
  register: freeipa_kerberos_srv_record
  changed_when: false
  failed_when: >-
    freeipa_kerberos_srv_record.rc != 0 or
    freeipa_kerberos_srv_record.stdout | trim | length == 0

- name: Verify that integrated DNS forwarding works
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "{{ freeipa_dns_forward_test_name }}"
      - A
  register: freeipa_forwarded_dns_record
  changed_when: false
  failed_when: >-
    freeipa_forwarded_dns_record.rc != 0 or
    freeipa_forwarded_dns_record.stdout | trim | length == 0

- name: Record successful completion of the FreeIPA server role
  ansible.builtin.set_fact:
    freeipa_server_role_completed: true
