---

- name: Verify common role completed
  ansible.builtin.assert:
    that:
      - common_role_completed is defined
      - common_role_completed | bool
    fail_msg: "The common role has not completed successfully on this host."

- name: Confirm that this host is the FreeIPA server
  ansible.builtin.assert:
    that:
      - aws_ec2_tags is defined
      - aws_ec2_tags['Role'] | default('') == 'freeipa'
      - aws_ec2_tags['NodeName'] | default('') == freeipa_server_shortname
      - aws_private_ip_address == freeipa_server_ip
    fail_msg: "The target host does not match the expected FreeIPA instance."

- name: Install FreeIPA packages
  block:
    - name: Install FreeIPA package dependencies
      ansible.builtin.dnf:
        name: "{{ freeipa_server_packages }}"
        state: present
        update_cache: true
  rescue:
    - name: Clear stale DNF metadata and packages
      ansible.builtin.command:
        argv:
          - dnf
          - clean
          - all
      changed_when: true

    - name: Rebuild DNF metadata
      ansible.builtin.command:
        argv:
          - dnf
          - makecache
          - --refresh
      changed_when: true

    - name: Retry FreeIPA package installation
      ansible.builtin.dnf:
        name: "{{ freeipa_server_packages }}"
        state: present
        update_cache: true

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Open FreeIPA firewall services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ freeipa_firewalld_services }}"

- name: Confirm FreeIPA hostname resolves to the private address
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ freeipa_server_fqdn }}"
  register: freeipa_hostname_lookup
  changed_when: false
  failed_when: >-
    freeipa_hostname_lookup.rc != 0 or
    (freeipa_hostname_lookup.stdout.split() | first | default('')) !=
    freeipa_server_ip

- name: Check whether FreeIPA is already configured
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        from ipalib.facts import is_ipa_configured;
        raise SystemExit(0 if is_ipa_configured() else 1)
  register: freeipa_server_configured
  changed_when: false
  failed_when: false

- name: Install FreeIPA when it is not already configured
  when: freeipa_server_configured.rc != 0
  block:
    - name: Retrieve FreeIPA credentials from AWS Secrets Manager
      ansible.builtin.command:
        argv:
          - "{{ aws_cli_executable }}"
          - secretsmanager
          - get-secret-value
          - --secret-id
          - "{{ freeipa_credentials_secret_name }}"
          - --region
          - "{{ aws_region }}"
          - --query
          - SecretString
          - --output
          - text
          - --no-cli-pager
      register: freeipa_secret_json
      changed_when: false
      no_log: true

    - name: Read FreeIPA credentials
      ansible.builtin.set_fact:
        freeipa_admin_password: >-
          {{ (freeipa_secret_json.stdout | from_json).admin_password | default('') }}
        freeipa_directory_manager_password: >-
          {{ (freeipa_secret_json.stdout | from_json).directory_manager_password | default('') }}
      no_log: true

    - name: Verify FreeIPA credentials are installer compatible
      ansible.builtin.assert:
        that:
          - >-
            freeipa_admin_password | length >= freeipa_password_min_length
          - >-
            freeipa_admin_password | length <= freeipa_password_max_length
          - >-
            freeipa_directory_manager_password | length >=
            freeipa_password_min_length
          - >-
            freeipa_directory_manager_password | length <=
            freeipa_password_max_length
          - freeipa_admin_password is match('^[A-Za-z0-9]+$')
          - >-
            freeipa_directory_manager_password is match('^[A-Za-z0-9]+$')
        fail_msg: >-
          FreeIPA passwords must each be 12-32 ASCII alphanumeric characters.
          Rotate the credentials secret before installing FreeIPA.
      no_log: true

    - name: Check for another FreeIPA installation process
      ansible.builtin.command:
        argv:
          - pgrep
          - -af
          - "[i]pa-server-install|[p]kispawn"
      register: freeipa_running_installers
      changed_when: false
      failed_when: freeipa_running_installers.rc not in [0, 1]

    - name: Refuse a concurrent FreeIPA installation
      ansible.builtin.assert:
        that:
          - freeipa_running_installers.stdout | trim | length == 0
        fail_msg: >-
          Another FreeIPA installation is already running:
          {{ freeipa_running_installers.stdout }}

    - name: Check for incomplete FreeIPA installation indicators
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ freeipa_partial_install_indicators }}"
      register: freeipa_partial_indicator_stats

    - name: Determine whether incomplete FreeIPA state exists
      ansible.builtin.set_fact:
        freeipa_cleanup_required: >-
          {{
            freeipa_partial_indicator_stats.results |
            selectattr('stat.exists') |
            list |
            length > 0
          }}

    - name: Run the supported FreeIPA uninstaller for incomplete state
      ansible.builtin.command:
        argv:
          - /usr/bin/flock
          - --nonblock
          - --conflict-exit-code
          - "75"
          - /run/freeipa-server-install.lock
          - /usr/sbin/ipa-server-install
          - --uninstall
          - --unattended
      register: freeipa_uninstall_attempt
      changed_when: true
      failed_when: false
      when: freeipa_cleanup_required | bool

    - name: Stop cleanup if another automation owns the installation lock
      ansible.builtin.fail:
        msg: "Another automation run is modifying FreeIPA on this server."
      when:
        - freeipa_cleanup_required | bool
        - freeipa_uninstall_attempt.rc == 75

    - name: Check for residual PKI and Directory Server instances
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ freeipa_pki_server_path }}"
        - "{{ freeipa_directory_server_path }}"
      register: freeipa_residual_instance_stats
      when: freeipa_cleanup_required | bool

    - name: Stop services belonging to an incomplete FreeIPA installation
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ freeipa_partial_install_services }}"
      failed_when: false
      when: freeipa_cleanup_required | bool

    - name: Remove a residual PKI server instance
      ansible.builtin.command:
        argv:
          - pki-server
          - remove
          - --force
          - --remove-conf
          - "{{ freeipa_pki_server_instance }}"
      changed_when: true
      when:
        - freeipa_cleanup_required | bool
        - freeipa_residual_instance_stats.results[0].stat.exists | default(false)

    - name: Remove a residual Directory Server instance
      ansible.builtin.command:
        argv:
          - dsctl
          - "{{ freeipa_directory_server_instance }}"
          - remove
          - --do-it
      changed_when: true
      when:
        - freeipa_cleanup_required | bool
        - freeipa_residual_instance_stats.results[1].stat.exists | default(false)

    - name: Remove stale FreeIPA bootstrap artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ freeipa_partial_install_artifacts }}"
      when: freeipa_cleanup_required | bool

    - name: Ensure FreeIPA state directories exist after cleanup
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ freeipa_state_directories }}"

    - name: Wait for FreeIPA TCP ports to remain free
      ansible.builtin.wait_for:
        port: "{{ item }}"
        state: stopped
        timeout: 60
      loop: "{{ freeipa_required_tcp_ports }}"
      when: freeipa_cleanup_required | bool

    - name: Confirm required FreeIPA TCP ports are available
      ansible.builtin.wait_for:
        port: "{{ item }}"
        state: stopped
        timeout: 10
      loop: "{{ freeipa_required_tcp_ports }}"

    - name: Run the first FreeIPA installation attempt
      ansible.builtin.command:
        argv:
          - /usr/bin/flock
          - --nonblock
          - --conflict-exit-code
          - "75"
          - /run/freeipa-server-install.lock
          - /usr/sbin/ipa-server-install
          - --unattended
          - --hostname
          - "{{ freeipa_server_fqdn }}"
          - --ip-address
          - "{{ freeipa_server_ip }}"
          - --domain
          - "{{ freeipa_domain }}"
          - --realm
          - "{{ freeipa_realm }}"
          - --setup-dns
          - --forwarder
          - "{{ freeipa_dns_forwarder }}"
          - --reverse-zone
          - "{{ freeipa_reverse_zone }}"
          - --no-dnssec-validation
          - --no-host-dns
          - --no-ntp
          - --admin-password
          - "{{ freeipa_admin_password }}"
          - --ds-password
          - "{{ freeipa_directory_manager_password }}"
      register: freeipa_install_attempt
      changed_when: freeipa_install_attempt.rc == 0
      failed_when: false
      no_log: true

    - name: Diagnose and retry a failed FreeIPA installation once
      when: freeipa_install_attempt.rc not in [0, 75]
      block:
        - name: Read the first FreeIPA installation errors
          ansible.builtin.shell: |
            set -o pipefail
            grep -Ei \
              'error|critical|exception|failed|requires|currently in use|unable|invalid' \
              /var/log/ipaserver-install.log 2>/dev/null |
              tail -n 120
          args:
            executable: /bin/bash
          register: freeipa_install_diagnostics
          changed_when: false
          failed_when: false

        - name: Display the first FreeIPA installation errors
          ansible.builtin.debug:
            var: freeipa_install_diagnostics.stdout_lines

        - name: Check retry cleanup indicators
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ freeipa_partial_install_indicators }}"
          register: freeipa_partial_indicator_stats

        - name: Determine whether retry cleanup is required
          ansible.builtin.set_fact:
            freeipa_cleanup_required: >-
              {{
                freeipa_partial_indicator_stats.results |
                selectattr('stat.exists') |
                list |
                length > 0
              }}

        - name: Run the supported FreeIPA uninstaller before retry
          ansible.builtin.command:
            argv:
              - /usr/bin/flock
              - --nonblock
              - --conflict-exit-code
              - "75"
              - /run/freeipa-server-install.lock
              - /usr/sbin/ipa-server-install
              - --uninstall
              - --unattended
          register: freeipa_uninstall_attempt
          changed_when: true
          failed_when: false
          when: freeipa_cleanup_required | bool

        - name: Stop retry if another automation owns the installation lock
          ansible.builtin.fail:
            msg: "Another automation run is modifying FreeIPA on this server."
          when:
            - freeipa_cleanup_required | bool
            - freeipa_uninstall_attempt.rc == 75

        - name: Check residual instances before retry
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ freeipa_pki_server_path }}"
            - "{{ freeipa_directory_server_path }}"
          register: freeipa_residual_instance_stats
          when: freeipa_cleanup_required | bool

        - name: Stop incomplete FreeIPA services before retry
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: false
            state: stopped
          loop: "{{ freeipa_partial_install_services }}"
          failed_when: false
          when: freeipa_cleanup_required | bool

        - name: Remove the residual PKI server instance before retry
          ansible.builtin.command:
            argv:
              - pki-server
              - remove
              - --force
              - --remove-conf
              - "{{ freeipa_pki_server_instance }}"
          changed_when: true
          when:
            - freeipa_cleanup_required | bool
            - >-
              freeipa_residual_instance_stats.results[0].stat.exists |
              default(false)

        - name: Remove the residual Directory Server instance before retry
          ansible.builtin.command:
            argv:
              - dsctl
              - "{{ freeipa_directory_server_instance }}"
              - remove
              - --do-it
          changed_when: true
          when:
            - freeipa_cleanup_required | bool
            - >-
              freeipa_residual_instance_stats.results[1].stat.exists |
              default(false)

        - name: Remove stale FreeIPA bootstrap artifacts before retry
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ freeipa_partial_install_artifacts }}"
          when: freeipa_cleanup_required | bool

        - name: Ensure FreeIPA state directories exist before retry
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop: "{{ freeipa_state_directories }}"

        - name: Wait for FreeIPA TCP ports to remain free before retry
          ansible.builtin.wait_for:
            port: "{{ item }}"
            state: stopped
            timeout: 60
          loop: "{{ freeipa_required_tcp_ports }}"
          when: freeipa_cleanup_required | bool

        - name: Run the second FreeIPA installation attempt
          ansible.builtin.command:
            argv:
              - /usr/bin/flock
              - --nonblock
              - --conflict-exit-code
              - "75"
              - /run/freeipa-server-install.lock
              - /usr/sbin/ipa-server-install
              - --unattended
              - --hostname
              - "{{ freeipa_server_fqdn }}"
              - --ip-address
              - "{{ freeipa_server_ip }}"
              - --domain
              - "{{ freeipa_domain }}"
              - --realm
              - "{{ freeipa_realm }}"
              - --setup-dns
              - --forwarder
              - "{{ freeipa_dns_forwarder }}"
              - --reverse-zone
              - "{{ freeipa_reverse_zone }}"
              - --no-dnssec-validation
              - --no-host-dns
              - --no-ntp
              - --admin-password
              - "{{ freeipa_admin_password }}"
              - --ds-password
              - "{{ freeipa_directory_manager_password }}"
          register: freeipa_install_attempt
          changed_when: freeipa_install_attempt.rc == 0
          failed_when: false
          no_log: true

    - name: Stop if another automation owns the installation lock
      ansible.builtin.fail:
        msg: "Another automation run is installing FreeIPA on this server."
      when: freeipa_install_attempt.rc == 75

    - name: Read the final FreeIPA installation errors
      ansible.builtin.shell: |
        set -o pipefail
        grep -Ei \
          'error|critical|exception|failed|requires|currently in use|unable|invalid' \
          /var/log/ipaserver-install.log 2>/dev/null |
          tail -n 120
      args:
        executable: /bin/bash
      register: freeipa_install_diagnostics
      changed_when: false
      failed_when: false
      when: freeipa_install_attempt.rc not in [0, 75]

    - name: Display the final FreeIPA installation errors
      ansible.builtin.debug:
        var: freeipa_install_diagnostics.stdout_lines
      when: freeipa_install_attempt.rc not in [0, 75]

    - name: Confirm a FreeIPA installation attempt succeeded
      ansible.builtin.assert:
        that:
          - freeipa_install_attempt.rc == 0
        fail_msg: >-
          FreeIPA installation failed after a clean retry. Review the
          sanitized diagnostic output immediately above.

    - name: Clear FreeIPA credentials from Ansible host facts
      ansible.builtin.set_fact:
        freeipa_admin_password: null
        freeipa_directory_manager_password: null
        freeipa_secret_json: null
      no_log: true

- name: Confirm FreeIPA is configured
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        from ipalib.facts import is_ipa_configured;
        raise SystemExit(0 if is_ipa_configured() else 1)
  changed_when: false

- name: Ensure FreeIPA is enabled and running
  ansible.builtin.systemd_service:
    name: ipa
    enabled: true
    state: started

- name: Verify FreeIPA services
  ansible.builtin.command:
    argv:
      - ipactl
      - status
  register: freeipa_service_status
  changed_when: false
  retries: 6
  delay: 10
  until: freeipa_service_status.rc == 0

- name: Verify FreeIPA DNS record
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "{{ freeipa_server_fqdn }}"
      - A
  register: freeipa_a_record
  changed_when: false
  retries: 6
  delay: 5
  until: >-
    freeipa_a_record.rc == 0 and
    freeipa_server_ip in freeipa_a_record.stdout_lines

- name: Verify FreeIPA LDAP service record
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "_ldap._tcp.{{ freeipa_domain }}"
      - SRV
  register: freeipa_ldap_record
  changed_when: false
  retries: 6
  delay: 5
  until: >-
    freeipa_ldap_record.rc == 0 and
    freeipa_server_fqdn + '.' in freeipa_ldap_record.stdout

- name: Verify FreeIPA Kerberos service record
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "_kerberos._udp.{{ freeipa_domain }}"
      - SRV
  register: freeipa_kerberos_record
  changed_when: false
  retries: 6
  delay: 5
  until: >-
    freeipa_kerberos_record.rc == 0 and
    freeipa_server_fqdn + '.' in freeipa_kerberos_record.stdout

- name: Verify integrated DNS forwarding
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@127.0.0.1"
      - "{{ freeipa_dns_forward_test_name }}"
      - A
  register: freeipa_forwarded_record
  changed_when: false
  retries: 6
  delay: 5
  until: >-
    freeipa_forwarded_record.rc == 0 and
    freeipa_forwarded_record.stdout | trim | length > 0

- name: Record successful completion of the FreeIPA server role
  ansible.builtin.set_fact:
    freeipa_server_role_completed: true
