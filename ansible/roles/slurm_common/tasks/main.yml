---
- name: Install Slurm packages
  ansible.builtin.dnf:
    name: "{{ slurm_packages }}"
    enablerepo: crb
    state: present

- name: Create the Slurm service group
  ansible.builtin.group:
    name: slurm
    gid: "{{ slurm_service_gid }}"
    system: true
    state: present

- name: Create the Slurm service user
  ansible.builtin.user:
    name: slurm
    uid: "{{ slurm_service_uid }}"
    group: slurm
    home: /var/lib/slurm
    shell: /sbin/nologin
    create_home: false
    system: true
    state: present

- name: Create root-owned Slurm directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0755'
    state: directory
  loop: "{{ slurm_directories_root }}"

- name: Create slurm-owned Slurm directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: slurm
    group: slurm
    mode: '0755'
    state: directory
  loop: "{{ slurm_directories_slurm }}"

- name: Deploy Slurm Configuration
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: "{{ slurm_config_path }}"
    owner: root
    group: root
    mode: '0644'
  register: slurm_common_configuration
