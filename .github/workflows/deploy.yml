name: Deploy Manually
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy_terraform:
    name: Deploy Infrastructure With Terraform
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
      TF_VAR_owner: ${{ vars.TF_OWNER }}
      TF_VAR_availability_zone: ${{ vars.TF_AVAILABILITY_ZONE }}
      TF_VAR_ami_id: ${{ vars.TF_AMI_ID }}
      TF_VAR_compute_count: ${{ vars.TF_COMPUTE_COUNT }}

    outputs:
      ansible_transfer_bucket: ${{ steps.tf_outputs.outputs.ansible_transfer_bucket }}
      efs_file_system_id: ${{ steps.tf_outputs.outputs.efs_file_system_id }}
      efs_home_access_point_id: ${{ steps.tf_outputs.outputs.efs_home_access_point_id }}
      efs_shared_access_point_id: ${{ steps.tf_outputs.outputs.efs_shared_access_point_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify required GitHub environment secret
        shell: bash
        env:
          HPCUSER_INITIAL_PASSWORD: ${{ secrets.HPCUSER_INITIAL_PASSWORD }}
        run: |
          if [[ ${#HPCUSER_INITIAL_PASSWORD} -lt 12 ]] ||
             [[ "$HPCUSER_INITIAL_PASSWORD" == *$'\n'* ]]; then
            echo "HPCUSER_INITIAL_PASSWORD must contain at least 12" \
              "characters and no line breaks." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -input=false

      - name: Plan Terraform Deployment
        run: terraform -chdir=terraform plan -out=tfplan -input=false

      - name: Apply Terraform Plan
        run: terraform -chdir=terraform apply tfplan

      - name: Retrieve Terraform outputs
        id: tf_outputs
        run: |
          echo "ansible_transfer_bucket=$(terraform -chdir=terraform output -raw ansible_transfer_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "efs_file_system_id=$(terraform -chdir=terraform output -raw efs_file_system_id)" >> "$GITHUB_OUTPUT"
          echo "efs_home_access_point_id=$(terraform -chdir=terraform output -raw efs_home_access_point_id)" >> "$GITHUB_OUTPUT"
          echo "efs_shared_access_point_id=$(terraform -chdir=terraform output -raw efs_shared_access_point_id)" >> "$GITHUB_OUTPUT"

      - name: Authenticate for secret bootstrap
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_SECRETS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Bootstrap missing secret values
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          umask 077

          freeipa_secret_name="${TF_VAR_project_name}/freeipa/credentials"
          munge_secret_name="${TF_VAR_project_name}/slurm/munge"
          database_secret_name="${TF_VAR_project_name}/slurm/database"

          secret_dir="$(mktemp -d "${RUNNER_TEMP}/hpc-secrets.XXXXXX")"

          cleanup() {
            rm -f \
              "${secret_dir}/freeipa.json" \
              "${secret_dir}/munge.json" \
              "${secret_dir}/database.json"
            rmdir "${secret_dir}" 2>/dev/null || true
          }

          trap cleanup EXIT

          current_version_count() {
            aws secretsmanager list-secret-version-ids \
              --secret-id "$1" \
              --region "$AWS_REGION" \
              --query "length(Versions[?contains(VersionStages, 'AWSCURRENT')])" \
              --output text
          }

          if [[ "$(current_version_count "$freeipa_secret_name")" == "0" ]]; then
            admin_password="$(openssl rand -hex 32)"
            directory_manager_password="$(openssl rand -hex 32)"

            jq -n \
              --arg admin_password "$admin_password" \
              --arg directory_manager_password "$directory_manager_password" \
              '{
                admin_password: $admin_password,
                directory_manager_password: $directory_manager_password
              }' > "${secret_dir}/freeipa.json"

            aws secretsmanager put-secret-value \
              --secret-id "$freeipa_secret_name" \
              --region "$AWS_REGION" \
              --secret-string "file://${secret_dir}/freeipa.json" \
              --no-cli-pager \
              >/dev/null

            unset admin_password directory_manager_password
            echo "Initialized ${freeipa_secret_name}"
          else
            echo "${freeipa_secret_name} already has a current value; leaving it unchanged"
          fi

          if [[ "$(current_version_count "$munge_secret_name")" == "0" ]]; then
            munge_key_base64="$(openssl rand 1024 | base64 -w 0)"

            jq -n \
              --arg munge_key_base64 "$munge_key_base64" \
              '{munge_key_base64: $munge_key_base64}' \
              > "${secret_dir}/munge.json"

            aws secretsmanager put-secret-value \
              --secret-id "$munge_secret_name" \
              --region "$AWS_REGION" \
              --secret-string "file://${secret_dir}/munge.json" \
              --no-cli-pager \
              >/dev/null

            unset munge_key_base64
            echo "Initialized ${munge_secret_name}"
          else
            echo "${munge_secret_name} already has a current value; leaving it unchanged"
          fi

          if [[ "$(current_version_count "$database_secret_name")" == "0" ]]; then
            database_password="$(openssl rand -hex 32)"

            jq -n \
              --arg database_name "slurm_acct_db" \
              --arg username "slurm" \
              --arg password "$database_password" \
              '{
                database_name: $database_name,
                username: $username,
                password: $password
              }' > "${secret_dir}/database.json"

            aws secretsmanager put-secret-value \
              --secret-id "$database_secret_name" \
              --region "$AWS_REGION" \
              --secret-string "file://${secret_dir}/database.json" \
              --no-cli-pager \
              >/dev/null

            unset database_password
            echo "Initialized ${database_secret_name}"
          else
            echo "${database_secret_name} already has a current value; leaving it unchanged"
          fi


  cluster_configurations:
    name: Configure Cluster with Ansible
    runs-on: ubuntu-latest
    needs: deploy_terraform
    environment: dev
    env:
      ANSIBLE_TRANSFER_BUCKET: ${{ needs.deploy_terraform.outputs.ansible_transfer_bucket }}
      EFS_FILE_SYSTEM_ID: ${{ needs.deploy_terraform.outputs.efs_file_system_id }}
      EFS_HOME_ACCESS_POINT_ID: ${{ needs.deploy_terraform.outputs.efs_home_access_point_id }}
      EFS_SHARED_ACCESS_POINT_ID: ${{ needs.deploy_terraform.outputs.efs_shared_access_point_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Python v3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install Session Manager plugin
        run: |
          curl -fsSL \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"
          session-manager-plugin --version
      - name: Wait for SSM connections
        working-directory: ansible
        run: |
          ansible all \
            -i inventory/cluster.aws_ec2.yml \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=900 sleep=10" \
            -e "ansible_aws_ssm_bucket_name=${ANSIBLE_TRANSFER_BUCKET}"



      - name: Inspect Dynamic Inventory Graph
        working-directory: ansible
        run: |
          ansible-inventory \
            -i inventory/cluster.aws_ec2.yml \
            --graph

      - name: Configure cluster with Ansible
        working-directory: ansible
        env:
          HPCUSER_INITIAL_PASSWORD: ${{ secrets.HPCUSER_INITIAL_PASSWORD }}
        run: |
          ansible-playbook \
            -i inventory/cluster.aws_ec2.yml \
            -e "ansible_aws_ssm_bucket_name=${ANSIBLE_TRANSFER_BUCKET}" \
            -e "efs_file_system_id=${EFS_FILE_SYSTEM_ID}" \
            -e "efs_home_access_point_id=${EFS_HOME_ACCESS_POINT_ID}" \
            -e "efs_shared_access_point_id=${EFS_SHARED_ACCESS_POINT_ID}" \
            playbooks/site.yml

      - name: Validate cluster configuration
        working-directory: ansible
        run: |
          ansible-playbook \
            -i inventory/cluster.aws_ec2.yml \
            -e "ansible_aws_ssm_bucket_name=${ANSIBLE_TRANSFER_BUCKET}" \
            playbooks/validate.yml




